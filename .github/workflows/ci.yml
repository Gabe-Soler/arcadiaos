name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ArcadiaBench revision the integration job runs against: the commit that
  # adds `arcadiabench scenario` and `arcadiabench crew` to the `main` with
  # scenario catalogs and the fleet design track (1.1.0, not yet released),
  # which speaks arcadia-protocol 1.1.0 like this coordinator. The
  # integration tests run the `nominal` and `conjunction` variants of
  # catalog 1.0, a build on each outpost of catalog 1.1, and the fleet
  # design track with a crew ArcadiaOS designs.
  BENCH_REF: 36ecd7a463bf8775635fef2e078ff1ddc7882447

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  bench-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out ArcadiaBench
        uses: actions/checkout@v7
        with:
          repository: Gabe-Soler/arcadiabench
          ref: ${{ env.BENCH_REF }}
          path: bench
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bench -> target
      - name: Build ArcadiaBench
        run: cargo build --release --manifest-path bench/Cargo.toml
      - name: Build ArcadiaOS
        run: cargo build --release
      - name: Run ArcadiaOS under ArcadiaBench
        run: ARCADIABENCH="$GITHUB_WORKSPACE/bench/target/release/arcadiabench" cargo test --release --test bench
