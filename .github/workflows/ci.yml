name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # ArcadiaBench revision the integration job runs against: pinned to the
  # week-6 simulator (the Earth link with light-time delay, outages and the
  # conjunction blackout; authority enforcement; site coverage and relays;
  # protocol v0.2.0) that this coordinator speaks. The integration tests run
  # the `nominal` and `conjunction` variants.
  BENCH_REF: 7c41a9210d66496e7f8b6f7b9045a3775c3a112e

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features

  bench-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check out ArcadiaBench
        uses: actions/checkout@v5
        with:
          repository: Gabe-Soler/ArcadiaBench
          ref: ${{ env.BENCH_REF }}
          path: bench
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            bench -> target
      - name: Build ArcadiaBench
        run: cargo build --release --manifest-path bench/Cargo.toml
      - name: Build ArcadiaOS
        run: cargo build --release
      - name: Run ArcadiaOS under ArcadiaBench
        run: ARCADIABENCH="$GITHUB_WORKSPACE/bench/target/release/arcadiabench" cargo test --release --test bench
